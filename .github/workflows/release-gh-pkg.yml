name: Release GitHub Package

on:
    workflow_call:
        inputs:
          github-release:
            required: false
            type: boolean
            default: true
          github-package-publish:
            required: false
            type: boolean
            default: false
          github-package-scope:
            required: true
            type: boolean

jobs:
  release-gh-pkg:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: false
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.github-package-scope }}

      - name: Install
        run: vp install --frozen-lockfile

      - name: Generate GitHub Changelog
        run: vp dlx changelogithub
        continue-on-error: true
        if: ${{ inputs.github-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: ${{ inputs.github-package-publish }}
        run: vp pm publish --no-git-checks
