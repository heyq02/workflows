name: Release GitHub Package

on:
    workflow_call:

jobs:
  release-gh-pkg:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: false
          registry-url: https://npm.pkg.github.com
          scope: '@jdr-web-infra'

      - name: Install
        run: vp install --frozen-lockfile

      - name: Generate GitHub Changelog
        run: vp dlx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: vp pm publish --no-git-checks
